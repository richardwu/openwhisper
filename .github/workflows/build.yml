name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-unit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # SpeechAnalyzer needs the macOS 26 SDK; allow installed 26.x updates.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: xcodebuild -scheme OpenWhisper -configuration Debug -derivedDataPath .build build CODE_SIGN_IDENTITY="-"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme OpenWhisper \
            -only-testing:OpenWhisperTests \
            -destination 'platform=macOS' \
            -derivedDataPath .build \
            -resultBundlePath .build/xcresult/unit.xcresult \
            CODE_SIGN_IDENTITY="-"

      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: .build/xcresult/unit.xcresult

      - name: Archive derived data
        if: success()
        run: tar -czf derived-data.tgz -C .build Build SourcePackages

      - name: Upload derived data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: derived-data-${{ github.sha }}
          path: derived-data.tgz
          compression-level: 0
          retention-days: 1

  ui-e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4

      # SpeechAnalyzer needs the macOS 26 SDK; allow installed 26.x updates.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Download derived data
        uses: actions/download-artifact@v4
        with:
          name: derived-data-${{ github.sha }}

      - name: Restore derived data
        run: |
          mkdir -p .build
          tar -xzf derived-data.tgz -C .build

      - name: Run UI E2E tests
        run: |
          xcodebuild test \
            -scheme OpenWhisper \
            -only-testing:OpenWhisperUITests \
            -destination 'platform=macOS' \
            -derivedDataPath .build \
            -resultBundlePath .build/xcresult/ui-e2e.xcresult \
            CODE_SIGN_IDENTITY="-"

      - name: Upload UI test results and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-test-results
          path: .build/xcresult/ui-e2e.xcresult

  transcription-real:
    runs-on: macos-15
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4

      # SpeechAnalyzer needs the macOS 26 SDK; allow installed 26.x updates.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache Whisper model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: .build/models/ggml-small-q5_1.bin
          key: whisper-model-small-q5_1-ae85e4a935d7a567

      - name: Download Whisper model
        run: |
          mkdir -p .build/models
          if [ ! -f .build/models/ggml-small-q5_1.bin ]; then
            curl --fail --location -o .build/models/ggml-small-q5_1.bin \
              "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-small-q5_1.bin"
          fi
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  .build/models/ggml-small-q5_1.bin" | shasum -a 256 -c -

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Download derived data
        uses: actions/download-artifact@v4
        with:
          name: derived-data-${{ github.sha }}

      - name: Restore derived data
        run: |
          mkdir -p .build
          tar -xzf derived-data.tgz -C .build

      - name: Run real transcription tests
        env:
          TEST_RUNNER_OPENWHISPER_MODEL_PATH: ${{ github.workspace }}/.build/models/ggml-small-q5_1.bin
        run: |
          xcodebuild test \
            -scheme OpenWhisper \
            -only-testing:OpenWhisperTranscriptionTests \
            -destination 'platform=macOS' \
            -derivedDataPath .build \
            -resultBundlePath .build/xcresult/transcription-real.xcresult \
            CODE_SIGN_IDENTITY="-"

      - name: Upload transcription test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transcription-test-results
          path: .build/xcresult/transcription-real.xcresult
